<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcova · Inkly</title>
<meta name="description" content="Arcova makes Inkly, a private PDF editor and file converter for Android and iPhone.">
<link rel="icon" href="inkly.svg" type="image/svg+xml">
<style>
:root{--bg:#F3F7F5;--surface:#FFFFFF;--ink:#0B1F1A;--muted:#4E6660;--line:#E1E9E5;--accent:#0B6B4C;--hero:#0F3D30;--mint:#7CF2C1}
@media (prefers-color-scheme:dark){:root{--bg:#08130F;--surface:#11211B;--ink:#EAF4F0;--muted:#9DB3AB;--line:#1E332B;--accent:#7CF2C1;--hero:#14483A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:880px;margin:0 auto;padding:40px 16px 80px}
.brand{font-weight:800;font-size:22px;letter-spacing:-0.03em;margin-bottom:56px}
.app{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.app img{width:112px;height:112px;border-radius:26px}
h1{font-size:clamp(36px,7vw,56px);line-height:1.05;letter-spacing:-0.035em;margin:0}
.lead{font-size:20px;color:var(--muted);margin:8px 0 0;max-width:34ch}
.card{margin-top:40px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 22px}
.card h2{margin:0 0 6px;font-size:18px}
.card p{margin:0;color:var(--muted)}
a{color:var(--accent)}
footer{margin-top:56px;color:var(--muted);font-size:15px;display:flex;gap:20px;flex-wrap:wrap}
</style>
</head>
<body>
<main>
<div class="brand">Arcova</div>
<div class="app">
<img src="inkly.svg" alt="Inkly app icon">
<div>
<h1>Inkly</h1>
<p class="lead">Edit, organize and convert PDFs on your phone. Private by design.</p>
</div>
</div>
<div class="card">
<h2>Support</h2>
<p>Questions or problems? Email <a href="mailto:arcova.apps@gmail.com">arcova.apps@gmail.com</a>. We usually reply within two working days.</p>
</div>
<footer><a href="privacy/">Privacy policy</a><span>© 2026 Arcova</span></footer>
</main>
</body>
</html>
